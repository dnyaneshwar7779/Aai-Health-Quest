<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Ledger | Admin</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/animations.css">
    <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
</head>

<body style="background: var(--bg-darker); color: var(--text-main);">
    <div style="display: grid; grid-template-columns: 240px 1fr; min-height: 100vh;">
        <aside style="background: var(--bg-dark); border-right: 1px solid var(--border-color); padding: 20px;">
            <div class="logo" style="font-size: 18px; margin-bottom: 40px; color: var(--neon-green);">ADMIN PANEL</div>
            <nav>
                <a href="index.html"
                    style="display: block; padding: 12px; color: var(--text-secondary); text-decoration: none;">Overview</a>
                <a href="quests.html"
                    style="display: block; padding: 12px; color: var(--text-secondary); text-decoration: none;">Quests</a>
                <a href="users.html"
                    style="display: block; padding: 12px; color: var(--text-secondary); text-decoration: none;">Users</a>
                <a href="reviews.html"
                    style="display: block; padding: 12px; color: var(--text-secondary); text-decoration: none;">Moderation</a>
                <a href="redemptions.html"
                    style="display: block; padding: 12px; color: var(--neon-green); background: var(--card-bg); border-radius: 4px; text-decoration: none;">Transactions</a>
                <a href="messages.html"
                    style="display: block; padding: 12px; color: var(--text-secondary); text-decoration: none;">Support</a>
                <hr style="border: none; border-top: 1px solid var(--border-color); margin: 20px 0;">
                <a href="../dashboard.html" style="display: block; padding: 12px; color: var(--text-secondary); text-decoration: none;">&#8592; Back to User App</a>
                <button onclick="adminLogout()" style="display: block; width: 100%; padding: 12px; color: #ff4d4d; background: rgba(255,77,77,0.1); border: 1px solid #ff4d4d; border-radius: 4px; text-align: left; cursor: pointer; font-size: 15px; font-family: inherit; margin-top: 8px;">&#x2715; Logout</button>
            </nav>
        </aside>

        <main style="padding: 40px;">
            <h2 style="margin-bottom: 30px;">Subscription &amp; Reward Ledger</h2>

            <div class="card">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="text-align: left; color: var(--text-muted); font-size: 12px;">
                            <th style="padding: 12px;">WARRIOR</th>
                            <th>REWARD</th>
                            <th>TYPE</th>
                            <th>COST</th>
                            <th>STATUS</th>
                            <th>DATE</th>
                        </tr>
                    </thead>
                    <tbody id="transactionBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script>
        if (!isAdmin()) window.location.href = 'login.html';

        async function loadTransactions() {
            try {
                const transactions = await api.admin.getTransactions();
                const tbody = document.getElementById('transactionBody');
                tbody.innerHTML = transactions.map(t => `
                    <tr style="border-top: 1px solid var(--border-color);">
                        <td style="padding: 15px;">
                            <div style="font-weight: bold;">${(t.User && t.User.username) ? t.User.username : 'Unknown User'}</div>
                            <div style="font-size: 11px; color: var(--text-muted);">${(t.User && t.User.email) ? t.User.email : '-'}</div>
                        </td>
                        <td>${t.reward_name}</td>
                        <td style="text-transform: capitalize;">${t.reward_type.replace('_', ' ')}</td>
                        <td style="color: var(--gold); font-weight: bold;">${t.points_spent} HP</td>
                        <td>
                            <span style="background: rgba(0,255,65,0.1); color: var(--neon-green); padding: 2px 8px; border-radius: 10px; font-size: 11px;">
                                ${t.status}
                            </span>
                        </td>
                        <td style="font-size: 12px; color: var(--text-muted);">${new Date(t.redeemed_at).toLocaleString()}</td>
                    </tr>
                `).join('');
            } catch (error) { console.error(error); }
        }

        window.onload = loadTransactions;
    </script>
</body>

</html>
