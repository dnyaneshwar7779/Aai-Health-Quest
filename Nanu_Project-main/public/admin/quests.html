<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Management | Admin</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/animations.css">
    <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
</head>

<body style="background: var(--bg-darker); color: var(--text-main);">
    <div style="display: grid; grid-template-columns: 240px 1fr; min-height: 100vh;">
        <aside style="background: var(--bg-dark); border-right: 1px solid var(--border-color); padding: 20px;">
            <div class="logo" style="font-size: 18px; margin-bottom: 40px; color: var(--neon-green);">ADMIN PANEL</div>
            <nav>
                <a href="index.html"
                    style="display: block; padding: 12px; color: var(--text-secondary); text-decoration: none;">Overview</a>
                <a href="quests.html"
                    style="display: block; padding: 12px; color: var(--neon-green); background: var(--card-bg); border-radius: 4px; text-decoration: none;">Quests</a>
                <a href="users.html"
                    style="display: block; padding: 12px; color: var(--text-secondary); text-decoration: none;">Users</a>
                <a href="reviews.html"
                    style="display: block; padding: 12px; color: var(--text-secondary); text-decoration: none;">Moderation</a>
                <a href="redemptions.html"
                    style="display: block; padding: 12px; color: var(--text-secondary); text-decoration: none;">Transactions</a>
                <a href="messages.html"
                    style="display: block; padding: 12px; color: var(--text-secondary); text-decoration: none;">Support</a>
                <hr style="border: none; border-top: 1px solid var(--border-color); margin: 20px 0;">
                <a href="../dashboard.html" style="display: block; padding: 12px; color: var(--text-secondary); text-decoration: none;">&#8592; Back to User App</a>
                <button onclick="adminLogout()" style="display: block; width: 100%; padding: 12px; color: #ff4d4d; background: rgba(255,77,77,0.1); border: 1px solid #ff4d4d; border-radius: 4px; text-align: left; cursor: pointer; font-size: 15px; font-family: inherit; margin-top: 8px;">&#x2715; Logout</button>
            </nav>
        </aside>

        <main style="padding: 40px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h2>Quest Management</h2>
                <button onclick="openQuestModal()" class="btn btn-primary">Create New Quest</button>
            </div>

            <div id="questList" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;"></div>
        </main>
    </div>

    <!-- Quest Modal (Create/Edit) -->
    <div id="questModal"
        style="display: none; position: fixed; inset: 0; background: var(--hero-overlay); backdrop-filter: blur(5px); z-index: 2000; align-items: center; justify-content: center;">
        <div class="card" style="max-width: 500px; width: 90%;">
            <h3 id="modalTitle">Create New Health Quest</h3>
            <form id="questForm" style="margin-top: 20px;">
                <input type="hidden" id="questId">
                <div class="form-group">
                    <label class="form-label">Quest Title</label>
                    <input type="text" id="title" class="form-input" required placeholder="e.g., 5k Step Challenge">
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="description" class="form-input" required
                        placeholder="Complete 5,000 steps in a single day"></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label class="form-label">Type</label>
                        <select id="type" class="form-input">
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="milestone">Milestone</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Target Value</label>
                        <input type="number" id="target" class="form-input" required placeholder="5000">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label class="form-label">XP Reward</label>
                        <input type="number" id="xpReward" class="form-input" required placeholder="100">
                    </div>
                    <div class="form-group">
                        <label class="form-label">HP Reward</label>
                        <input type="number" id="hpReward" class="form-input" required placeholder="50">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Required Level</label>
                    <input type="number" id="reqLevel" class="form-input" value="1">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" onclick="closeQuestModal()" class="btn btn-outline"
                        style="flex: 1;">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Deploy Quest</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script>
        if (!isAdmin()) window.location.href = 'login.html';

        async function loadQuests() {
            try {
                const quests = await api.getQuests();
                const list = document.getElementById('questList');
                list.innerHTML = quests.map(q => `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items: start;">
                            <div>
                                <h4 style="color: var(--neon-green);">${q.title}</h4>
                                <span style="font-size: 10px; background: var(--bg-dark); padding: 2px 6px; border-radius: 10px;">${q.quest_type}</span>
                            </div>
                            <div style="display: flex; gap: 10px;">
                                <button onclick='editQuest(${JSON.stringify(q).replace(/'/g, "&apos;")})' class="btn btn-outline btn-sm">Edit</button>
                                <button onclick="deleteQuest(${q.id})" class="btn btn-sm btn-outline" style="color: #ff4d4d; border-color: #ff4d4d;">Delete</button>
                            </div>
                        </div>
                        <p style="font-size: 12px; color: var(--text-secondary); margin: 10px 0;">${q.description}</p>
                        <div style="font-size: 12px;">
                            <span>Target: ${q.target_value}</span> | 
                            <span style="color: var(--gold);">XP: ${q.xp_reward}</span> | 
                            <span style="color: var(--neon-green);">HP: ${q.health_points_reward}</span> |
                            <span>Lvl: ${q.required_level}</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) { console.error(error); }
        }

        function openQuestModal() {
            document.getElementById('questId').value = '';
            document.getElementById('questForm').reset();
            document.getElementById('modalTitle').textContent = 'Create New Health Quest';
            document.getElementById('questModal').style.display = 'flex';
        }

        function closeQuestModal() {
            document.getElementById('questModal').style.display = 'none';
        }

        function editQuest(q) {
            document.getElementById('questId').value = q.id;
            document.getElementById('title').value = q.title;
            document.getElementById('description').value = q.description;
            document.getElementById('type').value = q.quest_type;
            document.getElementById('target').value = q.target_value;
            document.getElementById('xpReward').value = q.xp_reward;
            document.getElementById('hpReward').value = q.health_points_reward;
            document.getElementById('reqLevel').value = q.required_level;

            document.getElementById('modalTitle').textContent = 'Edit Quest Arc';
            document.getElementById('questModal').style.display = 'flex';
        }

        async function deleteQuest(id) {
            if (!confirm('Are you sure you want to delete this quest from existence?')) return;
            try {
                await api.admin.deleteQuest(id);
                showNotification('Quest deleted successfully');
                loadQuests();
            } catch (error) { showNotification(error.message, 'error'); }
        }

        document.getElementById('questForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('questId').value;
            const data = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                quest_type: document.getElementById('type').value,
                target_value: parseInt(document.getElementById('target').value),
                xp_reward: parseInt(document.getElementById('xpReward').value),
                health_points_reward: parseInt(document.getElementById('hpReward').value),
                required_level: parseInt(document.getElementById('reqLevel').value)
            };

            try {
                if (id) {
                    await api.admin.updateQuest(id, data);
                    showNotification('Quest updated correctly');
                } else {
                    await api.admin.createQuest(data);
                    showNotification('New quest deployed to the realm!');
                }
                closeQuestModal();
                loadQuests();
            } catch (error) { showNotification(error.message, 'error'); }
        });

        window.onload = loadQuests;
    </script>
</body>

</html>
