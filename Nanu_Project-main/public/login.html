<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Aai Health Quest</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/animations.css">
    <script src="js/theme.js"></script>
    <style>
        .auth-container {
            max-width: 400px;
            margin: var(--spacing-xl) auto;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">AAI HEALTH QUEST</a>
        </div>
    </nav>

    <main class="container">
        <div class="auth-container card animate-slide-up">
            <h2 style="margin-bottom: var(--spacing-md); text-align: center;">Warrior Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" required placeholder="warrior@health.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-md);">Enter
                    the Arena</button>
            </form>
            <p style="text-align: center; margin-top: var(--spacing-md); color: var(--text-secondary);">
                New participant? <a href="register.html" style="color: var(--neon-green);">Sign up here</a>
            </p>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            const credentials = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await api.login(credentials);
                setToken(response.token);
                showNotification('Welcome back, Warrior!');
                setTimeout(() => window.location.href = 'dashboard.html', 1000);
            } catch (error) {
                showNotification(error.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Enter the Arena';
            }
        });
    </script>
</body>

</html>
